[package]
name = "toon-cli"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Runs and manages an agent node"
repository = "https://github.com/toon-protocol/toon_cli"

[[bin]]
name = "toon"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde_json = "1"
aes-gcm = "0.10"
base64 = "0.21"
bip39 = "2"
bs58 = "0.5"
ed25519-dalek = "2"
getrandom = "0.2"
hex = "0.4"
hmac = "0.12"
k256 = { version = "0.13", features = ["schnorr", "ecdh"] }
# NIP-44: the stream cipher and the key derivation, at the versions already in `Cargo.lock`.
chacha20 = "0.9"
hkdf = "0.12"
scrypt = "0.11"
sha2 = "0.10"
sha3 = "0.10"
zeroize = "1"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
connector-cli = { git = "https://github.com/toon-protocol/connector", rev = "f73f3b29d72547c3ea23540d2dacc2996e4e9f57" }
connector-operator = { git = "https://github.com/toon-protocol/connector", rev = "f73f3b29d72547c3ea23540d2dacc2996e4e9f57" }
# What `operator::dispatch_with_headers` forms and opens a packet with (and what the tests
# send a packet with): the connector's
# `send` cannot carry a header, which a subscribe request needs (NIP-98).
connector-domain = { git = "https://github.com/toon-protocol/connector", rev = "f73f3b29d72547c3ea23540d2dacc2996e4e9f57" }
connector-signer = { git = "https://github.com/toon-protocol/connector", rev = "f73f3b29d72547c3ea23540d2dacc2996e4e9f57" }
chrono = "0.4"
# The version `connector-operator` signs with: its `sign_request` takes this one's keypair.
ed25519-dalek-v1 = { package = "ed25519-dalek", version = "1" }
axum = "0.6"
tokio = { version = "1", features = ["rt-multi-thread"] }
tracing = "0.1"
# `rustls-tls-webpki-roots` is the TLS a `wss://` relay is dialled with: the rustls the connector
# already selects, with roots compiled in. `rustls` is that same version; `webpki-roots` is the
# version `reqwest` and the connector carry, whose roots `tls::connector` builds the dial's trust
# from, with `rustls-pemfile` reading `TOON_TRUSTED_ROOT`. (The feature brings an older
# `webpki-roots` of its own, which that connector does not use.)
tungstenite = { version = "0.20", features = ["rustls-tls-webpki-roots"] }
rustls = "0.21"
rustls-pemfile = "1"
webpki-roots = "0.25"
reqwest = { version = "0.11", default-features = false, features = ["blocking", "json", "rustls-tls", "socks"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
tempfile = "3"
# The connector's own fake chain RPC, and the channel-id arithmetic the fake answers with.
connector-chain-rpc = { git = "https://github.com/toon-protocol/connector", rev = "f73f3b29d72547c3ea23540d2dacc2996e4e9f57", features = ["test-support"] }
# The connector's fixtures for a real local chain: x402's contracts and a USDC on an
# `anvil`, which tests that move money run on (the spike's finding, on #2).
connector-settlement-evm = { git = "https://github.com/toon-protocol/connector", rev = "f73f3b29d72547c3ea23540d2dacc2996e4e9f57", features = ["test-util"] }
ethers = { version = "2", default-features = false }
# The fake remote relay's TLS: a certificate generated for the test, and a front that terminates it.
rcgen = "0.11"
tokio = { version = "1", features = ["rt", "net", "io-util"] }
tokio-rustls = "0.24"

# The relay image `toon` runs as a container (ADR 0001), pinned by digest. `build.rs`
# hands it to `toon --version`.
[package.metadata.toon]
relay_image = "ghcr.io/toon-protocol/relay:rust-sha-1b02f2e@sha256:3eea8d9421892a3f9617ce268db8df7432484221de08f7a217494ac0540d1059"

[lints.rust]
unsafe_code = "forbid"

# The keystore's scrypt is deliberately slow; unoptimised it makes every test that opens
# a wallet take seconds. Only the crates that do that work are optimised: scrypt and what
# it runs on, and the PBKDF2 that turns the mnemonic into a seed. The parameters are unchanged.
[profile.dev.package.scrypt]
opt-level = 3
[profile.dev.package.salsa20]
opt-level = 3
[profile.dev.package.pbkdf2]
opt-level = 3
[profile.dev.package.hmac]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
