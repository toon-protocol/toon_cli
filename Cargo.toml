[package]
name = "toon-cli"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Runs and manages an agent node"
repository = "https://github.com/toon-protocol/toon_cli"

[[bin]]
name = "toon"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde_json = "1"
aes-gcm = "0.10"
bip39 = "2"
bs58 = "0.5"
ed25519-dalek = "2"
getrandom = "0.2"
hex = "0.4"
hmac = "0.12"
k256 = "0.13"
scrypt = "0.11"
sha2 = "0.10"
sha3 = "0.10"
zeroize = "1"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

# The keystore's scrypt is deliberately slow; unoptimised it makes every test that opens
# a wallet take seconds. This changes how fast the crates run, not the parameters.
[profile.dev.package."*"]
opt-level = 3
