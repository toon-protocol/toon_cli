[package]
name = "toon-cli"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Runs and manages an agent node"
repository = "https://github.com/toon-protocol/toon_cli"

[[bin]]
name = "toon"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde_json = "1"
aes-gcm = "0.10"
bip39 = "2"
bs58 = "0.5"
ed25519-dalek = "2"
getrandom = "0.2"
hex = "0.4"
hmac = "0.12"
k256 = "0.13"
scrypt = "0.11"
sha2 = "0.10"
sha3 = "0.10"
zeroize = "1"
connector-cli = { git = "https://github.com/toon-protocol/connector", rev = "48a9db380e83c3692e81e83e3996fe39fd2f2705" }
axum = "0.6"
tokio = { version = "1", features = ["rt-multi-thread"] }
tracing = "0.1"
reqwest = { version = "0.11", default-features = false, features = ["blocking", "json", "rustls-tls"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
tempfile = "3"
# The connector's own fake chain RPC, and the channel-id arithmetic the fake answers with.
connector-chain-rpc = { git = "https://github.com/toon-protocol/connector", rev = "48a9db380e83c3692e81e83e3996fe39fd2f2705", features = ["test-support"] }
connector-signer = { git = "https://github.com/toon-protocol/connector", rev = "48a9db380e83c3692e81e83e3996fe39fd2f2705" }

# The relay image `toon` runs as a container (ADR 0001), pinned by digest. `build.rs`
# hands it to `toon --version`.
[package.metadata.toon]
relay_image = "ghcr.io/toon-protocol/relay:sha-1ca0bde@sha256:fd13b22a20cd5ffed08ffdca715b232e1537be1e61af969b10485f214b077f6d"

[lints.rust]
unsafe_code = "forbid"

# The keystore's scrypt is deliberately slow; unoptimised it makes every test that opens
# a wallet take seconds. Only the crates that do that work are optimised: scrypt and what
# it runs on, and the PBKDF2 that turns the mnemonic into a seed. The parameters are unchanged.
[profile.dev.package.scrypt]
opt-level = 3
[profile.dev.package.salsa20]
opt-level = 3
[profile.dev.package.pbkdf2]
opt-level = 3
[profile.dev.package.hmac]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
